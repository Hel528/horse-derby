<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>經典嘉年華：碌波跑馬仔 (Roll-a-Ball Derby)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Orbitron:wght@700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      overflow: hidden;
      background: #120905;
    }
    .arcade-num {
      font-family: 'Orbitron', monospace;
    }
    .bulb {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      animation: blink 1s infinite alternate;
    }
    .bulb:nth-child(odd) {
      animation-delay: 0.5s;
    }
    @keyframes blink {
      0% { background: #fde047; box-shadow: 0 0 6px #fde047, 0 0 10px #f59e0b; opacity: 1; }
      100% { background: #713f12; box-shadow: none; opacity: 0.45; }
    }
  </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center p-1 sm:p-2">

  <!-- 街機主外框 -->
  <div id="cabinetFrame" class="w-full max-w-4xl h-full max-h-[940px] rounded-2xl border-4 border-yellow-600 shadow-2xl flex flex-col overflow-hidden relative transition-colors duration-300" style="background: #2b1408;">

    <!-- 頂部燈箱與控制列 -->
    <div id="headerBar" class="px-2 py-1.5 bg-gradient-to-r from-red-950 via-red-800 to-red-950 border-b-2 border-yellow-500 flex flex-wrap items-center justify-between gap-1.5 z-20 shrink-0">
      <!-- 標題 -->
      <div class="flex items-center gap-1.5">
        <span class="bulb"></span>
        <h1 class="text-sm sm:text-base font-black tracking-wider text-yellow-300 drop-shadow">
          🐎 碌波跑馬仔 <span class="text-[11px] font-normal text-yellow-100 hidden md:inline">ROLL-A-BALL DERBY</span>
        </h1>
        <span class="bulb"></span>
      </div>

      <!-- 模式、難易度與風格切換 -->
      <div class="flex flex-wrap items-center gap-1 text-[11px] sm:text-xs">
        <!-- 單人/雙人切換 -->
        <div class="flex bg-black/50 p-0.5 rounded-lg border border-yellow-600/50">
          <button id="mode1PBtn" onclick="setGameMode('1P')" class="px-2 py-0.5 rounded font-bold bg-yellow-500 text-black transition">👤 單人</button>
          <button id="mode2PBtn" onclick="setGameMode('2P')" class="px-2 py-0.5 rounded font-bold text-yellow-200 hover:bg-white/10 transition">👥 雙人對戰</button>
        </div>

        <!-- 難易度切換 -->
        <div class="flex bg-black/50 p-0.5 rounded-lg border border-yellow-600/50" title="電腦對手速度與準度">
          <button id="diffEasyBtn" onclick="setDifficulty('easy')" class="px-1.5 py-0.5 rounded font-bold text-yellow-200 hover:bg-white/10 transition">🐢 簡單</button>
          <button id="diffNormalBtn" onclick="setDifficulty('normal')" class="px-1.5 py-0.5 rounded font-bold bg-emerald-500 text-black transition">🐎 普通</button>
          <button id="diffHardBtn" onclick="setDifficulty('hard')" class="px-1.5 py-0.5 rounded font-bold text-yellow-200 hover:bg-white/10 transition">🔥 困難</button>
        </div>

        <!-- 3種主題風格切換 -->
        <div class="flex bg-black/50 p-0.5 rounded-lg border border-yellow-600/50">
          <button id="themeRetroBtn" onclick="setTheme('retro')" class="px-1.5 py-0.5 rounded font-bold bg-amber-400 text-black transition">🎪 懷舊</button>
          <button id="themeNeonBtn" onclick="setTheme('neon')" class="px-1.5 py-0.5 rounded font-bold text-yellow-100 hover:bg-white/10 transition">🌈 霓虹</button>
          <button id="themeRoyalBtn" onclick="setTheme('royal')" class="px-1.5 py-0.5 rounded font-bold text-yellow-100 hover:bg-white/10 transition">👑 皇家</button>
        </div>

        <!-- 音效與重開 -->
        <button id="soundBtn" onclick="toggleSound()" class="px-2 py-0.5 rounded bg-black/50 border border-yellow-500/60 text-yellow-300 font-bold hover:bg-black/80">🔊</button>
        <button onclick="resetRace()" class="px-2 py-0.5 rounded bg-yellow-500 hover:bg-yellow-400 text-black font-black shadow">🔄 重開</button>
      </div>
    </div>

    <!-- 上半部：賽馬跑道螢幕 -->
    <div class="relative w-full h-[155px] sm:h-[180px] border-b-4 border-yellow-600 shrink-0 overflow-hidden bg-black">
      <canvas id="trackCanvas" class="w-full h-full block"></canvas>

      <!-- 即時領先資訊與步數 -->
      <div class="absolute top-1.5 left-2 right-2 flex justify-between items-center pointer-events-none text-[11px] sm:text-xs">
        <div id="scoreHudLeft" class="bg-black/75 border border-yellow-400/70 text-yellow-200 px-2.5 py-0.5 rounded-full font-bold shadow">
          🔴 1P 進度: <span id="p1StepText" class="arcade-num text-yellow-400 font-black">0</span> / 25 步
        </div>
        <div id="statusBanner" class="bg-red-900/90 border border-yellow-400 text-yellow-200 px-3 py-0.5 rounded-full font-black tracking-wide shadow">
          向上推波開跑！領先衝線奪冠！
        </div>
        <div id="scoreHudRight" class="bg-black/75 border border-cyan-400/70 text-cyan-200 px-2.5 py-0.5 rounded-full font-bold shadow">
          🤖 對手最佳: <span id="p2StepText" class="arcade-num text-cyan-300 font-black">0</span> / 25 步
        </div>
      </div>
    </div>

    <!-- 下半部：3D 遠近透視長球道區 -->
    <div id="boardContainer" class="relative w-full flex-1 min-h-[340px] overflow-hidden bg-stone-950">
      <canvas id="boardCanvas" class="w-full h-full block cursor-grab active:cursor-grabbing"></canvas>

      <!-- 底部操作說明浮水印 -->
      <div class="absolute bottom-1 left-0 right-0 text-center pointer-events-none">
        <span id="controlHint" class="inline-block bg-black/70 text-yellow-200/90 text-[11px] sm:text-xs px-3 py-0.5 rounded-full border border-yellow-500/40">
          👆 按住下方木球直接「向上推 / 掃」即可碌波！（黃洞 +1步｜藍洞 +2步｜紅心 +3步）
        </span>
      </div>
    </div>

    <!-- 衝線結算彈窗 -->
    <div id="winModal" class="hidden absolute inset-0 bg-black/80 backdrop-blur-sm z-40 flex flex-col items-center justify-center p-4">
      <div class="bg-gradient-to-b from-amber-900 via-red-950 to-stone-950 border-4 border-yellow-400 rounded-2xl p-6 max-w-md w-full text-center shadow-2xl">
        <div id="winEmoji" class="text-5xl mb-2">🏆</div>
        <h2 id="winTitle" class="text-2xl sm:text-3xl font-black text-yellow-300 mb-1">恭喜奪冠！</h2>
        <p id="winDesc" class="text-sm sm:text-base text-yellow-100/90 mb-4">你的賽馬率先衝過終點線！</p>
        <div id="rankList" class="bg-black/50 rounded-xl p-3 mb-5 text-left text-xs sm:text-sm space-y-1.5 border border-yellow-500/30 text-yellow-100"></div>
        <button onclick="resetRace()" class="w-full py-3 rounded-xl bg-gradient-to-r from-yellow-400 via-amber-500 to-yellow-400 text-black font-black text-base sm:text-lg shadow-lg hover:brightness-110 active:scale-95 transition">
          🏇 再玩一局！
        </button>
      </div>
    </div>

  </div>

<script>
// ==================== 音效引擎 (Web Audio API) ====================
let audioCtx = null;
let soundEnabled = true;

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
}

function playRollSound(speedRatio = 0.6) {
  if (!soundEnabled) return;
  initAudio();
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  const now = audioCtx.currentTime;
  osc.frequency.setValueAtTime(110 + speedRatio * 70, now);
  osc.frequency.exponentialRampToValueAtTime(55, now + 0.16);
  gain.gain.setValueAtTime(0.14, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.17);
}

function playBumpSound() {
  if (!soundEnabled) return;
  initAudio();
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  const now = audioCtx.currentTime;
  osc.frequency.setValueAtTime(240, now);
  osc.frequency.exponentialRampToValueAtTime(90, now + 0.06);
  gain.gain.setValueAtTime(0.12, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.07);
}

function playScoreSound(pts) {
  if (!soundEnabled) return;
  initAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const notes = pts === 3 ? [523.25, 659.25, 783.99, 1046.5] : (pts === 2 ? [440, 554.37, 659.25] : [392, 523.25]);
  notes.forEach((freq, idx) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, now + idx * 0.065);
    gain.gain.setValueAtTime(0.2, now + idx * 0.065);
    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.065 + 0.18);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now + idx * 0.065);
    osc.stop(now + idx * 0.065 + 0.19);
  });
}

function playFanfare(win = true) {
  if (!soundEnabled) return;
  initAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const melody = win ? [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5] : [392, 349.23, 329.63, 261.63];
  melody.forEach((freq, idx) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, now + idx * 0.12);
    gain.gain.setValueAtTime(0.16, now + idx * 0.12);
    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.22);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now + idx * 0.12);
    osc.stop(now + idx * 0.12 + 0.24);
  });
}

// ==================== 3 大主題風格設定 ====================
const THEMES = {
  retro: {
    name: '懷舊嘉年華',
    skyTop: '#1e3a5f',
    skyBottom: '#f59e0b',
    turfTop: '#78350f',
    turfBottom: '#451a03',
    laneLine: 'rgba(253, 224, 71, 0.35)',
    fenceColor: '#fef3c7',
    woodDark: '#2a1205',
    woodMid: '#6b3410',
    woodLight: '#9a4e1c',
    headFeltTop: '#064e3b',
    headFeltBottom: '#022c22',
    railColor: '#d97706',
    railHighlight: '#fde047',
    ballColors: [
      { hi: '#fffbeb', mid: '#f59e0b', lo: '#78350f' },
      { hi: '#fecaca', mid: '#dc2626', lo: '#450a0a' }
    ]
  },
  neon: {
    name: '霓虹街機',
    skyTop: '#090014',
    skyBottom: '#2e1065',
    turfTop: '#0f172a',
    turfBottom: '#020617',
    laneLine: 'rgba(34, 211, 238, 0.45)',
    fenceColor: '#22d3ee',
    woodDark: '#090414',
    woodMid: '#1e1b4b',
    woodLight: '#312e81',
    headFeltTop: '#3b0764',
    headFeltBottom: '#1e0536',
    railColor: '#ec4899',
    railHighlight: '#22d3ee',
    ballColors: [
      { hi: '#ecfeff', mid: '#06b6d4', lo: '#164e63' },
      { hi: '#fdf2f8', mid: '#ec4899', lo: '#831843' }
    ]
  },
  royal: {
    name: '皇家草地',
    skyTop: '#0284c7',
    skyBottom: '#bae6fd',
    turfTop: '#15803d',
    turfBottom: '#14532d',
    laneLine: 'rgba(255, 255, 255, 0.35)',
    fenceColor: '#ffffff',
    woodDark: '#1c1917',
    woodMid: '#44403c',
    woodLight: '#57534e',
    headFeltTop: '#166534',
    headFeltBottom: '#052e16',
    railColor: '#eab308',
    railHighlight: '#fef08a',
    ballColors: [
      { hi: '#ffffff', mid: '#e2e8f0', lo: '#475569' },
      { hi: '#fef9c3', mid: '#eab308', lo: '#713f12' }
    ]
  }
};

// ==================== 難易度設定 ====================
const DIFFICULTIES = {
  easy: {
    name: '簡單',
    minDelay: 5.0,   // 最快 5 秒碌一球
    maxDelay: 7.0,   // 最慢 7 秒碌一球
    missRate: 0.55,  // 55% 唔入洞
    twoPtChance: 0.25,
    threePtChance: 0.04
  },
  normal: {
    name: '普通',
    minDelay: 3.3,
    maxDelay: 4.8,
    missRate: 0.38,  // 38% 唔入洞
    twoPtChance: 0.32,
    threePtChance: 0.08
  },
  hard: {
    name: '困難',
    minDelay: 2.1,
    maxDelay: 3.3,
    missRate: 0.18,  // 只有 18% 唔入洞
    twoPtChance: 0.42,
    threePtChance: 0.16
  }
};

let currentThemeKey = 'retro';
let gameMode = '1P'; // '1P' or '2P'
let currentDifficulty = 'normal'; // 'easy' | 'normal' | 'hard'
const TARGET_STEPS = 25;

// ==================== 賽馬資料 ====================
const horses = [
  { id: 0, name: '1P 赤兔號', badge: '1P', color: '#ef4444', coat: '#b91c1c', mane: '#fef08a', steps: 0, displaySteps: 0, isPlayer: true, aiTimer: 0, nextAiRoll: 3.5, stride: 0 },
  { id: 1, name: '2P 藍電號', badge: 'CPU', color: '#38bdf8', coat: '#0284c7', mane: '#e0f2fe', steps: 0, displaySteps: 0, isPlayer: false, aiTimer: 0, nextAiRoll: 3.8, stride: 1.5 },
  { id: 2, name: '金威號', badge: 'CPU', color: '#facc15', coat: '#d97706', mane: '#fef9c3', steps: 0, displaySteps: 0, isPlayer: false, aiTimer: 0, nextAiRoll: 4.1, stride: 3.0 },
  { id: 3, name: '翡翠號', badge: 'CPU', color: '#4ade80', coat: '#15803d', mane: '#dcfce7', steps: 0, displaySteps: 0, isPlayer: false, aiTimer: 0, nextAiRoll: 3.6, stride: 4.5 }
];

let raceStarted = false;
let raceFinished = false;
let finishOrder = [];

// ==================== 頂端三角蜂窩計分洞與緩衝釘 ====================
// 世界座標：wx (-1 ~ 1), wy (0 為底部發球端 ~ 1 為頂端靶區)
const holes = [
  // 最頂排 (1分黃洞 x3)
  { wx: -0.52, wy: 0.90, r: 0.088, pts: 1, color: '#facc15', ring: '#fef08a', label: '1' },
  { wx:  0.00, wy: 0.92, r: 0.088, pts: 1, color: '#facc15', ring: '#fef08a', label: '1' },
  { wx:  0.52, wy: 0.90, r: 0.088, pts: 1, color: '#facc15', ring: '#fef08a', label: '1' },
  // 第二排 (2分藍洞 x2 + 正中3分紅心大獎洞)
  { wx: -0.44, wy: 0.77, r: 0.086, pts: 2, color: '#38bdf8', ring: '#bae6fd', label: '2' },
  { wx:  0.00, wy: 0.78, r: 0.082, pts: 3, color: '#ef4444', ring: '#fca5a5', label: '3' },
  { wx:  0.44, wy: 0.77, r: 0.086, pts: 2, color: '#38bdf8', ring: '#bae6fd', label: '2' },
  // 第三排 (2分藍洞 x2)
  { wx: -0.25, wy: 0.66, r: 0.085, pts: 2, color: '#38bdf8', ring: '#bae6fd', label: '2' },
  { wx:  0.25, wy: 0.66, r: 0.085, pts: 2, color: '#38bdf8', ring: '#bae6fd', label: '2' },
  // 前排 (1分黃洞 x3)
  { wx: -0.54, wy: 0.56, r: 0.088, pts: 1, color: '#facc15', ring: '#fef08a', label: '1' },
  { wx:  0.00, wy: 0.55, r: 0.088, pts: 1, color: '#facc15', ring: '#fef08a', label: '1' },
  { wx:  0.54, wy: 0.56, r: 0.088, pts: 1, color: '#facc15', ring: '#fef08a', label: '1' }
];

const bumpers = [
  { wx: -0.26, wy: 0.84, r: 0.022 },
  { wx:  0.26, wy: 0.84, r: 0.022 },
  { wx: -0.24, wy: 0.60, r: 0.022 },
  { wx:  0.24, wy: 0.60, r: 0.022 }
];

// ==================== 球道與滾球狀態 ====================
let lanes = [];
const activePointers = new Map(); // pointerId -> { laneIdx, ball, startX, startY, curX, curY, lastX, lastY, lastTime }

function createLane(laneIndex, horseIndex, title, accentColor) {
  return {
    laneIndex,
    horseIndex,
    title,
    accentColor,
    aimX: 0,
    balls: [
      { id: 0, homeWx: -0.24, homeWy: 0.09, wx: -0.24, wy: 0.09, vx: 0, vy: 0, r: 0.068, state: 'ready', colorIdx: 0, sinkTimer: 0, targetHole: null, trail: [] },
      { id: 1, homeWx:  0.24, homeWy: 0.09, wx:  0.24, wy: 0.09, vx: 0, vy: 0, r: 0.068, state: 'ready', colorIdx: 1, sinkTimer: 0, targetHole: null, trail: [] }
    ],
    popups: [],
    holeFlash: []
  };
}

function getNextAiDelay() {
  const diff = DIFFICULTIES[currentDifficulty];
  return diff.minDelay + Math.random() * (diff.maxDelay - diff.minDelay);
}

function setupLanes() {
  activePointers.clear();
  if (gameMode === '1P') {
    horses[1].isPlayer = false;
    horses[1].badge = 'CPU';
    horses[1].name = '藍電號';
    lanes = [createLane(0, 0, '1P 赤兔號球道', '#ef4444')];
    document.getElementById('scoreHudRight').innerHTML = `🤖 對手最佳: <span id="p2StepText" class="arcade-num text-cyan-300 font-black">0</span> / ${TARGET_STEPS} 步`;
    document.getElementById('controlHint').textContent = '👆 按住下方木球直接「向上推 / 掃」即可碌波！（黃洞 +1步｜藍洞 +2步｜紅心 +3步）';
  } else {
    horses[1].isPlayer = true;
    horses[1].badge = '2P';
    horses[1].name = '2P 藍電號';
    lanes = [
      createLane(0, 0, '🔴 1P 赤兔號 (左道)', '#ef4444'),
      createLane(1, 1, '🔵 2P 藍電號 (右道)', '#38bdf8')
    ];
    document.getElementById('scoreHudRight').innerHTML = `🔵 2P 進度: <span id="p2StepText" class="arcade-num text-cyan-300 font-black">0</span> / ${TARGET_STEPS} 步`;
    document.getElementById('controlHint').textContent = '👥 雙人同屏：左右兩邊可同時用手指向上推波！（或鍵盤 1P: A/D/W ｜ 2P: ⬅️/➡️/⬆️）';
  }
}

function setGameMode(mode) {
  gameMode = mode;
  document.getElementById('mode1PBtn').className = mode === '1P'
    ? 'px-2 py-0.5 rounded font-bold bg-yellow-500 text-black transition'
    : 'px-2 py-0.5 rounded font-bold text-yellow-200 hover:bg-white/10 transition';
  document.getElementById('mode2PBtn').className = mode === '2P'
    ? 'px-2 py-0.5 rounded font-bold bg-cyan-400 text-black transition'
    : 'px-2 py-0.5 rounded font-bold text-yellow-200 hover:bg-white/10 transition';
  resetRace();
}

function setDifficulty(diff) {
  currentDifficulty = diff;
  document.getElementById('diffEasyBtn').className = diff === 'easy'
    ? 'px-1.5 py-0.5 rounded font-bold bg-emerald-400 text-black transition'
    : 'px-1.5 py-0.5 rounded font-bold text-yellow-200 hover:bg-white/10 transition';
  document.getElementById('diffNormalBtn').className = diff === 'normal'
    ? 'px-1.5 py-0.5 rounded font-bold bg-emerald-400 text-black transition'
    : 'px-1.5 py-0.5 rounded font-bold text-yellow-200 hover:bg-white/10 transition';
  document.getElementById('diffHardBtn').className = diff === 'hard'
    ? 'px-1.5 py-0.5 rounded font-bold bg-rose-500 text-white transition'
    : 'px-1.5 py-0.5 rounded font-bold text-yellow-200 hover:bg-white/10 transition';

  // 即時更新現有電腦馬匹的冷卻時間
  horses.forEach(h => {
    if (!h.isPlayer) h.nextAiRoll = getNextAiDelay();
  });

  if (!raceStarted && !raceFinished) {
    document.getElementById('statusBanner').textContent = `難度：${DIFFICULTIES[diff].name}｜向上推波開跑！`;
  }
}

function setTheme(themeKey) {
  currentThemeKey = themeKey;
  ['retro', 'neon', 'royal'].forEach(k => {
    const btn = document.getElementById('theme' + k.charAt(0).toUpperCase() + k.slice(1) + 'Btn');
    if (k === themeKey) {
      btn.className = 'px-1.5 py-0.5 rounded font-bold bg-amber-400 text-black transition';
    } else {
      btn.className = 'px-1.5 py-0.5 rounded font-bold text-yellow-100 hover:bg-white/10 transition';
    }
  });
}

function resetRace() {
  raceStarted = false;
  raceFinished = false;
  finishOrder = [];
  document.getElementById('winModal').classList.add('hidden');
  document.getElementById('statusBanner').textContent = `難度：${DIFFICULTIES[currentDifficulty].name}｜向上推波開跑！`;
  setupLanes();
  horses.forEach((h, i) => {
    h.steps = 0;
    h.displaySteps = 0;
    h.aiTimer = 0;
    h.nextAiRoll = getNextAiDelay();
    h.stride = i * 1.4;
  });
  updateHud();
}

function updateHud() {
  const p1El = document.getElementById('p1StepText');
  const p2El = document.getElementById('p2StepText');
  if (p1El) p1El.textContent = Math.min(TARGET_STEPS, horses[0].steps);
  if (p2El) {
    if (gameMode === '2P') {
      p2El.textContent = Math.min(TARGET_STEPS, horses[1].steps);
    } else {
      const bestCpu = Math.max(horses[1].steps, horses[2].steps, horses[3].steps);
      p2El.textContent = Math.min(TARGET_STEPS, bestCpu);
    }
  }
}

// ==================== 畫布與 3D 透視座標轉換 ====================
const trackCanvas = document.getElementById('trackCanvas');
const trackCtx = trackCanvas.getContext('2d');
const boardCanvas = document.getElementById('boardCanvas');
const boardCtx = boardCanvas.getContext('2d');

let tWidth = 800, tHeight = 175;
let bWidth = 800, bHeight = 420;

function resizeCanvases() {
  const dpr = window.devicePixelRatio || 1;
  const tRect = trackCanvas.parentElement.getBoundingClientRect();
  tWidth = Math.max(300, tRect.width);
  tHeight = Math.max(130, tRect.height);
  trackCanvas.width = tWidth * dpr;
  trackCanvas.height = tHeight * dpr;
  trackCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const bRect = boardCanvas.parentElement.getBoundingClientRect();
  bWidth = Math.max(300, bRect.width);
  bHeight = Math.max(300, bRect.height);
  boardCanvas.width = bWidth * dpr;
  boardCanvas.height = bHeight * dpr;
  boardCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvases);

function getLaneViewport(laneIdx) {
  const totalLanes = lanes.length;
  const subW = bWidth / totalLanes;
  const offsetX = laneIdx * subW;
  return { offsetX, subW, subH: bHeight };
}

// 將世界座標 (wx: -1~1, wy: 0~1) 投影到 3D 遠近透視畫面座標
function projectToLane(laneIdx, wx, wy) {
  const { offsetX, subW, subH } = getLaneViewport(laneIdx);
  const clampedWy = Math.max(-0.08, Math.min(1.06, wy));
  // 深度透視曲線：遠端壓縮令球道更有真實長斜坡感
  const depth = Math.pow(Math.max(0, clampedWy), 0.84);
  const yBottom = subH * 0.93;
  const yTop = subH * 0.07;
  const sy = yBottom - depth * (yBottom - yTop);

  const maxHalfWBottom = subW * (lanes.length === 1 ? 0.43 : 0.44);
  const maxHalfWTop = subW * (lanes.length === 1 ? 0.23 : 0.27);
  const halfW = maxHalfWBottom + depth * (maxHalfWTop - maxHalfWBottom);

  const sx = offsetX + subW * 0.5 + wx * halfW;
  const scale = halfW / maxHalfWBottom;
  return { x: sx, y: sy, scale: Math.max(0.25, scale), halfW };
}

function screenToWorld(laneIdx, sx, sy) {
  const { offsetX, subW, subH } = getLaneViewport(laneIdx);
  const yBottom = subH * 0.93;
  const yTop = subH * 0.07;
  const normY = Math.max(0, Math.min(1, (yBottom - sy) / (yBottom - yTop)));
  const wy = Math.pow(normY, 1 / 0.84);
  const p = projectToLane(laneIdx, 0, wy);
  const wx = (sx - (offsetX + subW * 0.5)) / p.halfW;
  return { wx: Math.max(-0.88, Math.min(0.88, wx)), wy };
}

// ==================== 直覺式「向上推/掃」碌波控制 ====================
function getCanvasPos(e) {
  const rect = boardCanvas.getBoundingClientRect();
  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  };
}

function launchBall(lane, ball, vx, vy) {
  if (raceFinished) return;
  if (!raceStarted) {
    raceStarted = true;
    document.getElementById('statusBanner').textContent = `🔥 比賽進行中（${DIFFICULTIES[currentDifficulty].name}）！快啲碌波入紅心！`;
  }
  ball.state = 'rolling';
  ball.vx = Math.max(-0.65, Math.min(0.65, vx));
  ball.vy = Math.max(0.95, Math.min(2.15, vy));
  ball.trail = [];
  playRollSound( (ball.vy - 0.9) / 1.25 );
}

boardCanvas.addEventListener('pointerdown', (e) => {
  if (raceFinished) return;
  initAudio();
  boardCanvas.setPointerCapture(e.pointerId);
  const pos = getCanvasPos(e);

  const laneIdx = (lanes.length === 2 && pos.x > bWidth / 2) ? 1 : 0;
  const lane = lanes[laneIdx];
  if (!lane) return;

  // 搵該球道處於 ready 狀態且最接近手指的木球
  const readyBalls = lane.balls.filter(b => b.state === 'ready');
  if (readyBalls.length === 0) return;

  let chosen = readyBalls[0];
  let bestDist = Infinity;
  readyBalls.forEach(b => {
    const bp = projectToLane(laneIdx, b.wx, b.wy);
    const d = Math.hypot(pos.x - bp.x, pos.y - bp.y);
    if (d < bestDist) {
      bestDist = d;
      chosen = b;
    }
  });

  chosen.state = 'grabbed';
  const wPos = screenToWorld(laneIdx, pos.x, pos.y);
  chosen.wx = Math.max(-0.78, Math.min(0.78, wPos.wx));
  chosen.wy = Math.max(0.04, Math.min(0.22, wPos.wy));

  activePointers.set(e.pointerId, {
    laneIdx,
    ball: chosen,
    startX: pos.x,
    startY: pos.y,
    curX: pos.x,
    curY: pos.y,
    lastX: pos.x,
    lastY: pos.y,
    startTime: performance.now(),
    lastTime: performance.now()
  });
});

boardCanvas.addEventListener('pointermove', (e) => {
  const drag = activePointers.get(e.pointerId);
  if (!drag) return;
  const pos = getCanvasPos(e);
  const now = performance.now();

  drag.lastX = drag.curX;
  drag.lastY = drag.curY;
  drag.lastTime = now;
  drag.curX = pos.x;
  drag.curY = pos.y;

  const lane = lanes[drag.laneIdx];
  const ball = drag.ball;
  if (ball.state !== 'grabbed') return;

  const wPos = screenToWorld(drag.laneIdx, pos.x, pos.y);
  ball.wx = Math.max(-0.80, Math.min(0.80, wPos.wx));
  ball.wy = Math.max(0.04, Math.min(0.26, wPos.wy));

  // 如果玩家手指直接向上推過發球線 (wy >= 0.24 且向上移動超過 45px)，自動即時脫手飛出！
  const dyTotal = drag.startY - pos.y;
  if (wPos.wy >= 0.24 && dyTotal > 42) {
    const dt = Math.max(16, now - drag.startTime);
    const dx = pos.x - drag.startX;
    const flickSpeedY = (dyTotal / Math.max(45, dt)) * 1.35;
    const vy = Math.max(1.18, Math.min(2.05, 0.95 + (dyTotal / (bHeight * 0.34)) * 0.72 + flickSpeedY * 0.35));
    const vx = (dx / (bWidth / lanes.length)) * 1.05;
    launchBall(lane, ball, vx, vy);
    activePointers.delete(e.pointerId);
  }
});

function handlePointerRelease(e) {
  const drag = activePointers.get(e.pointerId);
  if (!drag) return;
  activePointers.delete(e.pointerId);

  const lane = lanes[drag.laneIdx];
  const ball = drag.ball;
  if (!lane || ball.state !== 'grabbed') return;

  const pos = getCanvasPos(e);
  const dx = pos.x - drag.startX;
  const dy = drag.startY - pos.y; // 向上推 dy > 0，向後拉 dy < 0
  const dist = Math.hypot(dx, dy);
  const dt = Math.max(18, performance.now() - drag.startTime);

  let vx = 0, vy = 1.42;

  if (dy > 14) {
    // 向上推波模式 (Push / Bowling Sweep)
    const speedFactor = (dy / dt) * 1.2;
    const distFactor = dy / (bHeight * 0.32);
    vy = 1.05 + distFactor * 0.65 + speedFactor * 0.38;
    vx = (dx / (bWidth / lanes.length)) * 1.15;
  } else if (dy < -14) {
    // 向後拉彈弓模式 (Slingshot Pull)
    const pullFactor = Math.abs(dy) / (bHeight * 0.25);
    vy = 1.10 + pullFactor * 0.85;
    vx = (-dx / (bWidth / lanes.length)) * 1.15;
  } else if (dist <= 14) {
    // 輕點一下木球：以適中力度自動向上碌出，保證唔會卡住！
    vy = 1.42 + (Math.random() * 0.16 - 0.08);
    vx = (ball.wx * -0.15) + (Math.random() * 0.1 - 0.05);
  }

  launchBall(lane, ball, vx, vy);
}

boardCanvas.addEventListener('pointerup', handlePointerRelease);
boardCanvas.addEventListener('pointercancel', handlePointerRelease);

// 電腦鍵盤支援 (1P: A/D/W, 2P: 左右方向鍵/上方向鍵)
window.addEventListener('keydown', (e) => {
  if (raceFinished) return;
  if (e.key === 'a' || e.key === 'A') {
    lanes[0].aimX = Math.max(-0.65, lanes[0].aimX - 0.12);
  } else if (e.key === 'd' || e.key === 'D') {
    lanes[0].aimX = Math.min(0.65, lanes[0].aimX + 0.12);
  } else if (e.key === 'w' || e.key === 'W' || e.key === ' ') {
    const b = lanes[0].balls.find(ball => ball.state === 'ready');
    if (b) {
      b.wx = lanes[0].aimX;
      launchBall(lanes[0], b, lanes[0].aimX * 0.25 + (Math.random() * 0.08 - 0.04), 1.48 + Math.random() * 0.18);
    }
  }

  if (lanes.length === 2) {
    if (e.key === 'ArrowLeft') {
      lanes[1].aimX = Math.max(-0.65, lanes[1].aimX - 0.12);
    } else if (e.key === 'ArrowRight') {
      lanes[1].aimX = Math.min(0.65, lanes[1].aimX + 0.12);
    } else if (e.key === 'ArrowUp') {
      const b2 = lanes[1].balls.find(ball => ball.state === 'ready');
      if (b2) {
        b2.wx = lanes[1].aimX;
        launchBall(lanes[1], b2, lanes[1].aimX * 0.25 + (Math.random() * 0.08 - 0.04), 1.48 + Math.random() * 0.18);
      }
    }
  }
});

// ==================== 進球加分與賽馬推進 ====================
function awardPoints(horseIdx, pts, lane, hole) {
  const h = horses[horseIdx];
  if (!h || h.steps >= TARGET_STEPS || raceFinished) return;

  h.steps = Math.min(TARGET_STEPS, h.steps + pts);
  updateHud();

  if (lane && hole) {
    playScoreSound(pts);
    lane.popups.push({
      wx: hole.wx,
      wy: hole.wy,
      text: `+${pts} 步!`,
      color: hole.color,
      alpha: 1,
      life: 0
    });
    lane.holeFlash.push({ hole, alpha: 1 });
  }

  if (h.steps >= TARGET_STEPS && !finishOrder.includes(h)) {
    finishOrder.push(h);
    if (finishOrder.length === 1) {
      triggerRaceFinish(h);
    }
  }
}

function triggerRaceFinish(winner) {
  raceFinished = true;
  const isHumanWin = winner.isPlayer;
  playFanfare(isHumanWin);

  const sorted = [...horses].sort((a, b) => b.steps - a.steps);
  document.getElementById('winEmoji').textContent = isHumanWin ? '🏆' : '🐎';
  document.getElementById('winTitle').textContent = isHumanWin ? `🎉 ${winner.name} 奪冠！` : `${winner.name} 率先衝線！`;
  document.getElementById('winDesc').textContent = isHumanWin
    ? `太犀利啦！喺「${DIFFICULTIES[currentDifficulty].name}」難度下率先跑完 ${TARGET_STEPS} 步奪得全場總冠軍！`
    : `差少少咋！再碌準啲紅心 3 分洞即可反敗為勝！`;

  const rankHtml = sorted.map((h, idx) => {
    const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '4️⃣';
    return `<div class="flex justify-between items-center py-1 px-2 rounded ${idx === 0 ? 'bg-yellow-500/25 font-bold text-yellow-200' : ''}">
      <span>${medal} ${h.name} (${h.badge})</span>
      <span class="arcade-num font-bold">${h.steps} / ${TARGET_STEPS} 步</span>
    </div>`;
  }).join('');
  document.getElementById('rankList').innerHTML = rankHtml;

  setTimeout(() => {
    document.getElementById('winModal').classList.remove('hidden');
  }, 650);
}

// ==================== 物理更新與真實街機 AI 節奏 ====================
function resetBallToTray(ball) {
  ball.state = 'ready';
  ball.wx = ball.homeWx;
  ball.wy = ball.homeWy;
  ball.vx = 0;
  ball.vy = 0;
  ball.trail = [];
  ball.targetHole = null;
}

function updatePhysics(dt) {
  // 1. 更新賽馬平滑跑動與電腦對手真實投球節奏
  const diff = DIFFICULTIES[currentDifficulty];
  horses.forEach((h) => {
    if (h.displaySteps < h.steps) {
      h.displaySteps = Math.min(h.steps, h.displaySteps + dt * 4.2);
      h.stride += dt * 16;
    } else if (raceStarted && !raceFinished) {
      h.stride += dt * 3.5;
    }

    // 電腦 AI：根據所選難易度決定碌波間隔與準繩度
    if (raceStarted && !raceFinished && !h.isPlayer) {
      h.aiTimer += dt;
      if (h.aiTimer >= h.nextAiRoll) {
        h.aiTimer = 0;
        h.nextAiRoll = getNextAiDelay();
        const roll = Math.random();
        if (roll < diff.missRate) {
          // 唔入洞
        } else if (roll < 1 - diff.threePtChance - diff.twoPtChance) {
          awardPoints(h.id, 1, null, null);
        } else if (roll < 1 - diff.threePtChance) {
          awardPoints(h.id, 2, null, null);
        } else {
          awardPoints(h.id, 3, null, null);
        }
      }
    }
  });

  // 2. 更新每條球道的滾球物理
  lanes.forEach((lane) => {
    lane.balls.forEach((ball) => {
      if (ball.state === 'rolling') {
        ball.trail.push({ wx: ball.wx, wy: ball.wy });
        if (ball.trail.length > 9) ball.trail.shift();

        // 斜坡下滑重力與摩擦力
        const slopeGravity = ball.wy > 0.48 ? 0.88 : 0.72;
        ball.vy -= slopeGravity * dt;
        ball.vx *= (1 - 0.45 * dt);
        ball.vy *= (1 - 0.25 * dt);

        ball.wx += ball.vx * dt;
        ball.wy += ball.vy * dt;

        // 左右木欄反彈
        const wallLimit = 0.89;
        if (ball.wx < -wallLimit) {
          ball.wx = -wallLimit;
          ball.vx = Math.abs(ball.vx) * 0.65;
          playBumpSound();
        } else if (ball.wx > wallLimit) {
          ball.wx = wallLimit;
          ball.vx = -Math.abs(ball.vx) * 0.65;
          playBumpSound();
        }

        // 頂端後擋板反彈
        if (ball.wy > 0.96) {
          ball.wy = 0.96;
          ball.vy = -Math.abs(ball.vy) * 0.48;
          ball.vx += (Math.random() - 0.5) * 0.25;
          playBumpSound();
        }

        // 緩衝釘 (Bumpers) 碰撞
        bumpers.forEach((bmp) => {
          const dx = ball.wx - bmp.wx;
          const dy = ball.wy - bmp.wy;
          const dist = Math.hypot(dx, dy);
          const minDist = bmp.r + 0.042;
          if (dist < minDist && dist > 0.0001) {
            const nx = dx / dist;
            const ny = dy / dist;
            ball.wx = bmp.wx + nx * minDist;
            ball.wy = bmp.wy + ny * minDist;
            const speed = Math.hypot(ball.vx, ball.vy);
            ball.vx = nx * Math.max(0.28, speed * 0.65);
            ball.vy = ny * Math.max(0.28, speed * 0.65);
            playBumpSound();
          }
        });

        // 檢查是否跌入計分洞
        const speed = Math.hypot(ball.vx, ball.vy);
        for (const hole of holes) {
          const dx = hole.wx - ball.wx;
          const dy = hole.wy - ball.wy;
          const dist = Math.hypot(dx, dy);

          if (dist < hole.r * 0.92) {
            // 如果球速唔係超快衝過，就會被洞口吸落袋！
            if (speed < 1.55 || dist < hole.r * 0.58) {
              ball.state = 'sinking';
              ball.sinkTimer = 0;
              ball.targetHole = hole;
              awardPoints(lane.horseIndex, hole.pts, lane, hole);
              break;
            } else {
              // 太大力擦邊彈開 (Lip-out)
              ball.vx += (dx / dist) * 0.25;
              ball.vy *= 0.72;
            }
          }
        }

        // 溜後返到底部發球區自動歸位
        if (ball.wy <= 0.06 && ball.vy < 0) {
          resetBallToTray(ball);
        }
      } else if (ball.state === 'sinking') {
        ball.sinkTimer += dt;
        if (ball.targetHole) {
          ball.wx += (ball.targetHole.wx - ball.wx) * 12 * dt;
          ball.wy += (ball.targetHole.wy - ball.wy) * 12 * dt;
        }
        if (ball.sinkTimer > 0.36) {
          resetBallToTray(ball);
        }
      }
    });

    // 同球道兩粒滾動中木球互相碰撞
    const b0 = lane.balls[0];
    const b1 = lane.balls[1];
    if (b0.state === 'rolling' && b1.state === 'rolling') {
      const dx = b1.wx - b0.wx;
      const dy = b1.wy - b0.wy;
      const dist = Math.hypot(dx, dy);
      if (dist < 0.11 && dist > 0.001) {
        const nx = dx / dist, ny = dy / dist;
        b0.vx -= nx * 0.35; b0.vy -= ny * 0.35;
        b1.vx += nx * 0.35; b1.vy += ny * 0.35;
        playBumpSound();
      }
    }

    // 更新得分飄字與洞口閃光
    lane.popups.forEach(p => { p.wy += dt * 0.12; p.life += dt; p.alpha = Math.max(0, 1 - p.life / 0.85); });
    lane.popups = lane.popups.filter(p => p.life < 0.85);

    lane.holeFlash.forEach(f => { f.alpha -= dt * 2.2; });
    lane.holeFlash = lane.holeFlash.filter(f => f.alpha > 0);
  });
}

// ==================== 繪製上半部：賽馬跑道 ====================
function drawTrack() {
  const theme = THEMES[currentThemeKey];
  trackCtx.clearRect(0, 0, tWidth, tHeight);

  // 天空背景
  const skyH = tHeight * 0.28;
  const skyGrad = trackCtx.createLinearGradient(0, 0, 0, skyH);
  skyGrad.addColorStop(0, theme.skyTop);
  skyGrad.addColorStop(1, theme.skyBottom);
  trackCtx.fillStyle = skyGrad;
  trackCtx.fillRect(0, 0, tWidth, skyH);

  // 跑道地面
  const turfGrad = trackCtx.createLinearGradient(0, skyH, 0, tHeight);
  turfGrad.addColorStop(0, theme.turfTop);
  turfGrad.addColorStop(1, theme.turfBottom);
  trackCtx.fillStyle = turfGrad;
  trackCtx.fillRect(0, skyH, tWidth, tHeight - skyH);

  // 白色護欄
  trackCtx.strokeStyle = theme.fenceColor;
  trackCtx.lineWidth = 2;
  trackCtx.beginPath();
  trackCtx.moveTo(0, skyH);
  trackCtx.lineTo(tWidth, skyH);
  trackCtx.stroke();
  for (let x = 20; x < tWidth; x += 36) {
    trackCtx.fillStyle = theme.fenceColor;
    trackCtx.fillRect(x, skyH - 7, 3, 10);
  }

  const startX = 52;
  const finishX = tWidth - 48;
  const trackRange = finishX - startX;

  // 終點黑白格仔線與拱門
  const checkW = 10;
  const rows = 10;
  const rowH = (tHeight - skyH) / rows;
  for (let r = 0; r < rows; r++) {
    trackCtx.fillStyle = r % 2 === 0 ? '#ffffff' : '#111827';
    trackCtx.fillRect(finishX, skyH + r * rowH, checkW, rowH);
    trackCtx.fillStyle = r % 2 === 1 ? '#ffffff' : '#111827';
    trackCtx.fillRect(finishX + checkW, skyH + r * rowH, checkW, rowH);
  }

  // 4 條跑道分隔線與賽馬
  const laneH = (tHeight - skyH) / 4;
  horses.forEach((h, idx) => {
    const laneTop = skyH + idx * laneH;
    const laneCenterY = laneTop + laneH * 0.56;

    if (idx > 0) {
      trackCtx.strokeStyle = theme.laneLine;
      trackCtx.lineWidth = 1;
      trackCtx.setLineDash([8, 6]);
      trackCtx.beginPath();
      trackCtx.moveTo(0, laneTop);
      trackCtx.lineTo(tWidth, laneTop);
      trackCtx.stroke();
      trackCtx.setLineDash([]);
    }

    const progress = Math.min(1, h.displaySteps / TARGET_STEPS);
    const hx = startX + progress * trackRange;
    const bounce = Math.abs(Math.sin(h.stride)) * 3.5;
    const legSwing = Math.sin(h.stride) * 6;

    drawHorseSprite(trackCtx, hx, laneCenterY - bounce, h, legSwing);
  });
}

function drawHorseSprite(ctx, x, y, h, legSwing) {
  ctx.save();
  ctx.translate(x, y);

  // 馬匹陰影
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(0, 13, 18, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // 前後四肢
  ctx.strokeStyle = h.coat;
  ctx.lineWidth = 3.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-9, 3); ctx.lineTo(-12 - legSwing, 12);
  ctx.moveTo(-5, 3); ctx.lineTo(-5 + legSwing * 0.7, 12);
  ctx.moveTo(8, 3);  ctx.lineTo(11 + legSwing, 12);
  ctx.moveTo(5, 3);  ctx.lineTo(5 - legSwing * 0.7, 12);
  ctx.stroke();

  // 馬尾
  ctx.strokeStyle = h.mane;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-13, -2);
  ctx.quadraticCurveTo(-21, -4, -23, 4);
  ctx.stroke();

  // 馬身
  ctx.fillStyle = h.coat;
  ctx.beginPath();
  ctx.ellipse(0, 0, 14, 7.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // 號碼鞍布
  ctx.fillStyle = h.color;
  ctx.fillRect(-6, -6, 11, 8);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 8px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(h.id + 1, -0.5, 0.5);

  // 馬頸與馬頭
  ctx.fillStyle = h.coat;
  ctx.beginPath();
  ctx.moveTo(8, -2);
  ctx.lineTo(15, -12);
  ctx.lineTo(22, -9);
  ctx.lineTo(19, -4);
  ctx.lineTo(12, 3);
  ctx.closePath();
  ctx.fill();

  // 騎師頭盔與彩衣
  ctx.fillStyle = h.color;
  ctx.beginPath();
  ctx.arc(3, -10, 4.5, 0, Math.PI * 2);
  ctx.fill();

  // 玩家標籤氣泡
  ctx.fillStyle = h.isPlayer ? '#fde047' : 'rgba(0,0,0,0.65)';
  ctx.fillRect(-38, -11, 22, 11);
  ctx.fillStyle = h.isPlayer ? '#000000' : '#ffffff';
  ctx.font = 'bold 8px sans-serif';
  ctx.fillText(h.badge, -27, -3);

  ctx.restore();
}

// ==================== 繪製下半部：3D 透視長球道與靶台 ====================
function drawBoard() {
  if (bWidth < 50 || bHeight < 50) return;
  const theme = THEMES[currentThemeKey];
  boardCtx.clearRect(0, 0, bWidth, bHeight);

  // 暗角背景
  boardCtx.fillStyle = theme.woodDark;
  boardCtx.fillRect(0, 0, bWidth, bHeight);

  lanes.forEach((lane, laneIdx) => {
    drawSingleLane(lane, laneIdx, theme);
  });

  // 雙人模式中間分隔金線
  if (lanes.length === 2) {
    boardCtx.strokeStyle = '#facc15';
    boardCtx.lineWidth = 3;
    boardCtx.beginPath();
    boardCtx.moveTo(bWidth / 2, 0);
    boardCtx.lineTo(bWidth / 2, bHeight);
    boardCtx.stroke();
  }
}

function drawSingleLane(lane, laneIdx, theme) {
  const bL = projectToLane(laneIdx, -1, 0);
  const bR = projectToLane(laneIdx,  1, 0);
  const mL = projectToLane(laneIdx, -1, 0.48);
  const mR = projectToLane(laneIdx,  1, 0.48);
  const tL = projectToLane(laneIdx, -1, 1);
  const tR = projectToLane(laneIdx,  1, 1);

  // 1. 下半段：3D 長木板滾球斜道 (wy: 0 ~ 0.48)
  const woodGrad = boardCtx.createLinearGradient(0, bL.y, 0, mL.y);
  woodGrad.addColorStop(0, theme.woodLight);
  woodGrad.addColorStop(1, theme.woodMid);
  boardCtx.fillStyle = woodGrad;
  boardCtx.beginPath();
  boardCtx.moveTo(bL.x, bL.y);
  boardCtx.lineTo(bR.x, bR.y);
  boardCtx.lineTo(mR.x, mR.y);
  boardCtx.lineTo(mL.x, mL.y);
  boardCtx.closePath();
  boardCtx.fill();

  // 縱向木紋與瞄準導向線
  for (let w = -0.75; w <= 0.75; w += 0.25) {
    const p0 = projectToLane(laneIdx, w, 0);
    const p1 = projectToLane(laneIdx, w, 0.48);
    boardCtx.strokeStyle = 'rgba(255,255,255,0.08)';
    boardCtx.lineWidth = 1;
    boardCtx.beginPath();
    boardCtx.moveTo(p0.x, p0.y);
    boardCtx.lineTo(p1.x, p1.y);
    boardCtx.stroke();
  }

  // 向上箭嘴引導紋
  for (let wy = 0.16; wy <= 0.40; wy += 0.11) {
    const c0 = projectToLane(laneIdx, 0, wy + 0.03);
    const cL = projectToLane(laneIdx, -0.18, wy);
    const cR = projectToLane(laneIdx,  0.18, wy);
    boardCtx.strokeStyle = 'rgba(253, 224, 71, 0.18)';
    boardCtx.lineWidth = 2;
    boardCtx.beginPath();
    boardCtx.moveTo(cL.x, cL.y);
    boardCtx.lineTo(c0.x, c0.y);
    boardCtx.lineTo(cR.x, cR.y);
    boardCtx.stroke();
  }

  // 2. 上半段：頂端三角蜂窩絨布靶區 (wy: 0.48 ~ 1.0)
  const feltGrad = boardCtx.createLinearGradient(0, mL.y, 0, tL.y);
  feltGrad.addColorStop(0, theme.headFeltTop);
  feltGrad.addColorStop(1, theme.headFeltBottom);
  boardCtx.fillStyle = feltGrad;
  boardCtx.beginPath();
  boardCtx.moveTo(mL.x, mL.y);
  boardCtx.lineTo(mR.x, mR.y);
  boardCtx.lineTo(tR.x, tR.y);
  boardCtx.lineTo(tL.x, tL.y);
  boardCtx.closePath();
  boardCtx.fill();

  // 斜坡與靶區交界金坎線
  boardCtx.strokeStyle = theme.railHighlight;
  boardCtx.lineWidth = 2.5;
  boardCtx.beginPath();
  boardCtx.moveTo(mL.x, mL.y);
  boardCtx.lineTo(mR.x, mR.y);
  boardCtx.stroke();

  // 發球區虛線 (wy = 0.24)
  const fL = projectToLane(laneIdx, -0.94, 0.24);
  const fR = projectToLane(laneIdx,  0.94, 0.24);
  boardCtx.strokeStyle = 'rgba(253, 224, 71, 0.45)';
  boardCtx.setLineDash([6, 5]);
  boardCtx.lineWidth = 1.5;
  boardCtx.beginPath();
  boardCtx.moveTo(fL.x, fL.y);
  boardCtx.lineTo(fR.x, fR.y);
  boardCtx.stroke();
  boardCtx.setLineDash([]);

  // 兩側立體護欄木邊
  boardCtx.strokeStyle = theme.railColor;
  boardCtx.lineWidth = 8;
  boardCtx.lineCap = 'round';
  boardCtx.beginPath();
  boardCtx.moveTo(bL.x, bL.y);
  boardCtx.lineTo(tL.x, tL.y);
  boardCtx.lineTo(tR.x, tR.y);
  boardCtx.lineTo(bR.x, bR.y);
  boardCtx.stroke();

  boardCtx.strokeStyle = theme.railHighlight;
  boardCtx.lineWidth = 2;
  boardCtx.stroke();

  // 3. 繪製頂端計分洞 (1分黃、2分藍、3分紅心)
  holes.forEach((h) => {
    const p = projectToLane(laneIdx, h.wx, h.wy);
    const rx = Math.max(8, h.r * p.halfW);
    const ry = Math.max(6, rx * 0.68); // 3D 透視橢圓洞口

    // 外發光環
    boardCtx.fillStyle = h.color;
    boardCtx.beginPath();
    boardCtx.ellipse(p.x, p.y, rx * 1.22, ry * 1.22, 0, 0, Math.PI * 2);
    boardCtx.fill();

    // 內部黑洞深淵
    boardCtx.fillStyle = '#09090b';
    boardCtx.beginPath();
    boardCtx.ellipse(p.x, p.y + 1.5, rx * 0.88, ry * 0.88, 0, 0, Math.PI * 2);
    boardCtx.fill();

    // 洞內分數文字
    boardCtx.fillStyle = h.ring;
    boardCtx.font = `900 ${Math.max(10, Math.round(rx * 0.82))}px Orbitron, sans-serif`;
    boardCtx.textAlign = 'center';
    boardCtx.textBaseline = 'middle';
    boardCtx.fillText(h.label, p.x, p.y + 1);
  });

  // 進洞閃光特效
  lane.holeFlash.forEach((f) => {
    const p = projectToLane(laneIdx, f.hole.wx, f.hole.wy);
    const rx = Math.max(10, f.hole.r * p.halfW * (1.8 - f.alpha * 0.5));
    boardCtx.strokeStyle = `rgba(254, 240, 138, ${f.alpha})`;
    boardCtx.lineWidth = 4;
    boardCtx.beginPath();
    boardCtx.ellipse(p.x, p.y, rx, rx * 0.7, 0, 0, Math.PI * 2);
    boardCtx.stroke();
  });

  // 4. 繪製金屬緩衝釘 (Bumpers)
  bumpers.forEach((bmp) => {
    const p = projectToLane(laneIdx, bmp.wx, bmp.wy);
    const r = Math.max(4, bmp.r * p.halfW);
    boardCtx.fillStyle = '#fde047';
    boardCtx.beginPath();
    boardCtx.arc(p.x, p.y, r, 0, Math.PI * 2);
    boardCtx.fill();
    boardCtx.strokeStyle = '#713f12';
    boardCtx.lineWidth = 1.5;
    boardCtx.stroke();
  });

  // 5. 繪製拖曳中瞄準虛線
  activePointers.forEach((drag) => {
    if (drag.laneIdx !== laneIdx) return;
    const bp = projectToLane(laneIdx, drag.ball.wx, drag.ball.wy);
    boardCtx.strokeStyle = '#fde047';
    boardCtx.lineWidth = 2.5;
    boardCtx.setLineDash([5, 5]);
    boardCtx.beginPath();
    boardCtx.moveTo(bp.x, bp.y);
    boardCtx.lineTo(bp.x + (drag.curX - drag.startX) * 0.4, bp.y - 75);
    boardCtx.stroke();
    boardCtx.setLineDash([]);
  });

  // 6. 繪製 2 粒立體滾球 (由遠到近排序)
  const sortedBalls = [...lane.balls].sort((a, b) => b.wy - a.wy);
  sortedBalls.forEach((ball) => {
    // 滾動軌跡
    if (ball.state === 'rolling' && ball.trail.length > 1) {
      for (let i = 0; i < ball.trail.length; i++) {
        const tp = projectToLane(laneIdx, ball.trail[i].wx, ball.trail[i].wy);
        const tr = Math.max(3, ball.r * tp.halfW * (i / ball.trail.length) * 0.65);
        boardCtx.fillStyle = `rgba(254, 243, 199, ${(i / ball.trail.length) * 0.25})`;
        boardCtx.beginPath();
        boardCtx.arc(tp.x, tp.y, tr, 0, Math.PI * 2);
        boardCtx.fill();
      }
    }

    const p = projectToLane(laneIdx, ball.wx, ball.wy);
    let radius = Math.max(10, ball.r * p.halfW);
    if (ball.state === 'sinking') {
      radius *= Math.max(0.2, 1 - ball.sinkTimer * 2.2);
    }

    // 待命發球區金色呼吸光圈 (令玩家一眼見到粒波)
    if (ball.state === 'ready' || ball.state === 'grabbed') {
      boardCtx.strokeStyle = ball.state === 'grabbed' ? '#22d3ee' : 'rgba(250, 204, 21, 0.75)';
      boardCtx.lineWidth = 2.5;
      boardCtx.beginPath();
      boardCtx.arc(p.x, p.y, radius + 4, 0, Math.PI * 2);
      boardCtx.stroke();
    }

    // 球體陰影
    boardCtx.fillStyle = 'rgba(0,0,0,0.45)';
    boardCtx.beginPath();
    boardCtx.ellipse(p.x + 2, p.y + radius * 0.35, radius * 0.92, radius * 0.55, 0, 0, Math.PI * 2);
    boardCtx.fill();

    // 3D 球體材質漸層 (安全半徑檢查避免 Canvas 報錯黑屏)
    const cSet = theme.ballColors[ball.colorIdx % theme.ballColors.length];
    const safeR = Math.max(4, radius);
    const ballGrad = boardCtx.createRadialGradient(
      p.x - safeR * 0.3,
      p.y - safeR * 0.3,
      safeR * 0.1,
      p.x,
      p.y,
      safeR
    );
    ballGrad.addColorStop(0, cSet.hi);
    ballGrad.addColorStop(0.55, cSet.mid);
    ballGrad.addColorStop(1, cSet.lo);

    boardCtx.fillStyle = ballGrad;
    boardCtx.beginPath();
    boardCtx.arc(p.x, p.y, safeR, 0, Math.PI * 2);
    boardCtx.fill();
  });

  // 7. 得分飄字動畫
  lane.popups.forEach((pop) => {
    const p = projectToLane(laneIdx, pop.wx, pop.wy);
    boardCtx.save();
    boardCtx.globalAlpha = pop.alpha;
    boardCtx.font = '900 18px "Noto Sans TC", sans-serif';
    boardCtx.fillStyle = pop.color;
    boardCtx.strokeStyle = '#000000';
    boardCtx.lineWidth = 3;
    boardCtx.textAlign = 'center';
    boardCtx.strokeText(pop.text, p.x, p.y - 12);
    boardCtx.fillText(pop.text, p.x, p.y - 12);
    boardCtx.restore();
  });

  // 雙人模式球道頂部標籤
  if (lanes.length === 2) {
    const topCenter = projectToLane(laneIdx, 0, 1.0);
    boardCtx.fillStyle = 'rgba(0,0,0,0.7)';
    boardCtx.fillRect(topCenter.x - 58, 4, 116, 20);
    boardCtx.fillStyle = lane.accentColor;
    boardCtx.font = 'bold 11px "Noto Sans TC", sans-serif';
    boardCtx.textAlign = 'center';
    boardCtx.fillText(lane.title, topCenter.x, 17);
  }
}

// ==================== 遊戲主迴圈 ====================
let lastFrameTime = performance.now();
function gameLoop(now) {
  const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
  lastFrameTime = now;

  updatePhysics(dt);
  drawTrack();
  drawBoard();

  requestAnimationFrame(gameLoop);
}

// 初始化啟動
setupLanes();
resizeCanvases();
setTimeout(resizeCanvases, 80);
requestAnimationFrame(gameLoop);
</script>
